repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      # Vendored files stay byte for byte as released.
      - id: end-of-file-fixer
        exclude: ^src/pypi_monitor/web/static/htmx\.min\.js$
      - id: trailing-whitespace
        exclude: ^src/pypi_monitor/web/static/htmx\.min\.js$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
