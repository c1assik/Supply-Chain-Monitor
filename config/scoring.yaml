# Комбинации правил дают бонус к сумме. В rules можно использовать шаблоны с *.
# guarddog.install.* — находки в коде, который исполняется при установке или импорте.
combos:
  - rules: [metadata.typosquat, metadata.new_package]
    bonus: 20
  - rules: [metadata.typosquat, guarddog.*threat-*]
    bonus: 17
  - rules: [metadata.new_package, guarddog.install.threat-*]
    bonus: 10
  - rules: [guarddog.capability-process-hooks, guarddog.install.threat-*]
    bonus: 18
  # Дифф: новый код становится подозрительным в связке, по отдельности это обычное обновление.
  # diff.install.* — изменения в коде, который исполняется при установке или импорте.
  - rules: [diff.install.new_dangerous_call, diff.install.new_import]
    bonus: 20
  - rules: [diff.install.new_dangerous_call, diff.install.new_url]
    bonus: 20
  - rules: [diff.install.new_dangerous_call, diff.install.new_ip]
    bonus: 20
  - rules: [diff.*new_dangerous_call, diff.*new_ip]
    bonus: 25
  # Код не из источника плюс новые опасные вызовы: так выглядит подмена при публикации.
  - rules: [consistency.*, diff.*new_dangerous_call]
    bonus: 30
  # Контекст: захваченный аккаунт или заброшенный пакет плюс опасные изменения.
  - rules: [context.owners_replaced, diff.*new_dangerous_call]
    bonus: 25
  - rules: [context.owner_added, diff.*new_dangerous_call]
    bonus: 15
  - rules: [context.dormant_release, diff.install.*]
    bonus: 15
  - rules: [context.version_jump, diff.install.*]
    bonus: 10

# Подавление известных ложных срабатываний.
allowlist:
  # Нормализованные имена пакетов: их релизы всегда получают скор 0.
  packages: []
  # Правила, которые не участвуют в скоринге.
  rules: []

# Множитель для пакетов из топа по загрузкам.
popularity_multiplier: 1.5

# Нижние границы уровней. Всё, что ниже medium, считается low.
levels:
  critical: 80
  high: 50
  medium: 20
