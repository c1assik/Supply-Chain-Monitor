# Веса скоринга. Вклад сигнала: вес * confidence.

# Вес сигнала по умолчанию.
severity_weights:
  low: 5
  medium: 15
  high: 35
  critical: 60

# Переопределение веса для конкретных правил: rule_id: вес.
rule_weights:
  # Обычная разработка: новые модули, зависимости и адреса. Сами по себе они не добавляют риска и
  # нужны как улики в карточке релиза и как части комбинаций ниже.
  diff.file.new_python: 0
  diff.new_import: 0
  diff.new_url: 0
  # Новый опасный вызов внутри функции сам ещё ни о чём не говорит.
  diff.new_dangerous_call: 5
  # Новые скрипты и нативные модули в platform wheel: обычная разработка, улики для комбинаций.
  # Пересборка бинарников platform wheel происходит в каждом релизе.
  diff.file.new_script: 0
  # Скрипт с загрузкой и непрозрачный блоб встречаются и в обычных релизах (pandas 3.1.0): сами по
  # себе это улики, а вес они получают в комбинациях с признаками захвата аккаунта ниже.
  diff.file.new_script_fetches: 5
  diff.file.new_blob: 5
  diff.file.new_platform_binary: 0
  diff.file.platform_binaries_changed: 0
  # Смена job'а публикации внутри того же репозитория бывает при обычном рефакторинге CI.
  provenance.workflow_changed: 5
  # Вендоринг, тесты и прочее, что не устанавливается: только улики.
  noise.diff.file.new_binary: 0
  noise.diff.file.new_blob: 0
  noise.diff.file.new_script: 0
  noise.diff.file.new_script_fetches: 0
  noise.diff.file.binary_changed: 0
  noise.diff.file.new_python: 0
  noise.diff.new_dangerous_call: 0
  noise.diff.new_import: 0
  noise.diff.new_ip: 0
  noise.diff.new_url: 0
  # Подобрано на train: python -m benchmarks.tune. Вручную не править.
  # Вес правила, не встречавшегося при подборе, берётся из severity_weights.
  guarddog.capability-filesystem-browser: 6
  guarddog.capability-process-hooks: 53
  guarddog.capability-process-spawn: 2
  guarddog.install.threat-network-exfil-messenger: 10
  guarddog.install.threat-network-exfil-sysinfo: 14
  guarddog.install.threat-network-exfiltration: 12
  guarddog.install.threat-network-outbound-shady-links: 17
  guarddog.install.threat-network-reverse-shell: 3
  guarddog.install.threat-process-cryptomining: 3
  guarddog.install.threat-process-download-exec: 35
  guarddog.install.threat-process-hooks: 9
  guarddog.install.threat-process-powershell-encoded: 56
  guarddog.install.threat-process-spawn-silent: 1
  guarddog.install.threat-runtime-obfuscation-base64exec: 32
  guarddog.install.threat-runtime-obfuscation-chr: 56
  guarddog.install.threat-runtime-obfuscation-general: 5
  guarddog.install.threat-runtime-obfuscation-import-exec: 56
  guarddog.install.threat-runtime-system-info: 1
  guarddog.install.threat-setup-import-aliasing: 56
  guarddog.install.threat-setup-network-in-install: 10
  guarddog.install.threat-setup-suspicious-imports: 25
  guarddog.threat-network-exfil-messenger: 9
  guarddog.threat-network-exfil-sysinfo: 23
  guarddog.threat-network-exfiltration: 6
  guarddog.threat-network-outbound-shady-links: 21
  guarddog.threat-runtime-obfuscation-base64exec: 1
  guarddog.threat-runtime-obfuscation-chr: 1
  guarddog.threat-runtime-obfuscation-general: 1
  guarddog.threat-runtime-screencapture: 1
  guarddog.threat-runtime-system-info: 6
  metadata.empty_readme: 14
  metadata.foreign_repository: 14
  metadata.no_repository: 14
  metadata.typosquat: 14
  # Ноль: в обычных пакетах встречаются не реже, чем в малвари.
  guarddog.capability-filesystem-delete: 0
  guarddog.capability-filesystem-read: 0
  guarddog.capability-filesystem-write-executable: 0
  guarddog.capability-network-download: 0
  guarddog.capability-network-lolbas: 0
  guarddog.capability-network-outbound: 0
  guarddog.capability-process-schedule: 0
  guarddog.capability-runtime-clipboard: 0
  guarddog.install.threat-filesystem-autostart: 0
  guarddog.install.threat-filesystem-destruction: 0
  guarddog.install.threat-filesystem-read: 0
  guarddog.install.threat-process-injection-dll: 0
  guarddog.install.threat-process-memory: 0
  guarddog.install.threat-process-sysinfo: 0
  guarddog.install.threat-runtime-dynamic-loader: 0
  guarddog.install.threat-runtime-enumeration: 0
  guarddog.install.threat-runtime-environment-read: 0
  guarddog.install.threat-runtime-keylogging: 0
  guarddog.install.threat-runtime-obfuscation: 0
  guarddog.install.threat-runtime-obfuscation-steganography: 0
  guarddog.install.threat-runtime-obfuscation-unicode: 0
  guarddog.install.threat-runtime-screencapture: 0
  guarddog.threat-filesystem-autostart: 0
  guarddog.threat-filesystem-destruction: 0
  guarddog.threat-filesystem-read: 0
  guarddog.threat-network-dns-exfil: 0
  guarddog.threat-network-reverse-shell: 0
  guarddog.threat-npm-http-dependency: 0
  guarddog.threat-npm-preinstall-script: 0
