  guarddog.threat-process-spawn-silent: 0
  guarddog.threat-process-sysinfo: 0
  guarddog.threat-runtime-dynamic-loader: 0
  guarddog.threat-runtime-enumeration: 0
  guarddog.threat-runtime-environment-read: 0
  guarddog.threat-runtime-keylogging: 0
  guarddog.threat-runtime-obfuscation: 0
  guarddog.threat-runtime-obfuscation-api: 0
  guarddog.threat-runtime-obfuscation-dynamic-eval: 0
  guarddog.threat-runtime-obfuscation-import-exec: 0
  guarddog.threat-runtime-obfuscation-log-suppress: 0
