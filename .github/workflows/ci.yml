name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: scm
          POSTGRES_PASSWORD: scm
          POSTGRES_DB: scm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scm -d scm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://scm:scm@localhost:5432/scm_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  # Reads live malware as data: nothing from the corpus is installed, imported or executed.
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e . --group dev
      - uses: actions/cache@v5
        with:
          path: |
            .benchmark/dataset
            .benchmark/negatives
          key: benchmark-corpus-${{ hashFiles('benchmarks/corpus.py', 'benchmarks/data/negatives.json') }}
      - run: python -m benchmarks.malware scan --negatives 300
      - run: python -m benchmarks.malware report --check --output "$GITHUB_STEP_SUMMARY"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: deploy/generate-env.sh
      - run: docker compose up --detach --wait --wait-timeout 120
      - if: failure()
        run: docker compose logs
      - run: docker compose down --volumes
